name: E2E (WordPress 7.0)

# E2E runs the @smoke subset (fast, high-signal: action-layer round-trip, editor
# load, publish -> front-end render) on every pull request and on push to main,
# and the full suite nightly / on manual dispatch.
#   - pull_request -> @smoke subset. Reports a check on EVERY PR so it can be a
#                     required status check (issue 82). Intentionally NO
#                     paths-ignore here: a required check that is skipped on a
#                     docs-only PR leaves the PR blocked on a check that never
#                     reports, so @smoke must always run and report on a PR.
#   - push to main -> @smoke subset. Post-merge standing watcher on the mainline
#                     commit (paths-ignore keeps docs-only pushes from re-running).
#   - nightly cron -> full suite.
#   - manual       -> full suite via workflow_dispatch.
#
# Making @smoke a REQUIRED check is a manual repo-admin step (branch protection on
# main requiring "E2E (WordPress 7.0) / e2e" + "ai-ready-check"); the fine-grained
# PAT cannot set branch protection. See issue 82. Promotion bar: once @smoke holds
# green for 2 weeks with zero flakes.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'readme.txt'
  schedule:
    - cron: '0 7 * * *'  # ~07:00 UTC nightly
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Dependency-network mitigation (issue #700). `wp-env start` builds its OWN
      # container images, and that build curls the Composer installer from
      # getcomposer.org and then runs `composer global require --dev
      # phpunit/phpunit` inside the tests-cli image (wp-env's GENERATED
      # Dockerfile — @wordpress/env lib/runtime/docker/init-config.js:271). No
      # repo manifest governs any of it, and wp-env's generated compose services
      # carry no `cache_from` (lib/runtime/docker/build-docker-compose-config.js),
      # so there is no supported hook for a buildx/layer cache. A bounded retry is
      # therefore the narrow mitigation: the observed failures (codeload 429 on
      # 2026-08-17, Composer 504 on 2026-08-16) are transient, and backoff is the
      # correct response to a 429.
      #
      # Why no explicit `env:stop` between attempts — two mechanisms, both in
      # @wordpress/env:
      #   1. lib/commands/start.js:79-88 catches a failed start and calls
      #      runtime.stop() best-effort, swallowing its own cleanup errors.
      #   2. lib/runtime/docker/index.js:148 calls stop() again at the top of the
      #      next start, because setCache() at :288 is only reached on success,
      #      so `shouldConfigureWp` is still true and the rebuild is forced.
      #
      # RESIDUAL RISKS, accepted:
      #   - the first attempt of every run still reaches the network, and a
      #     sustained (non-transient) outage still fails the job;
      #   - if Docker itself is wedged, mechanism 2's stop() can also fail — the
      #     retry then fails loudly on cleanup rather than running against a
      #     partially-started environment;
      #   - on a genuinely deterministic failure the job costs two extra failed
      #     start attempts plus the backoff before it reports.
      # The original error always stays visible in the grouped log; the retry
      # never hides it. Behaviour is pinned by
      # tests/InvariantTest.php::testWpEnvStartRetryIsBoundedAndFailsClosed.
      - name: Start wp-env (WordPress 7.0)
        run: |
          attempts=3
          for attempt in $(seq 1 "${attempts}"); do
            echo "::group::wp-env start (attempt ${attempt}/${attempts})"
            if npm run env:start; then
              echo "::endgroup::"
              echo "wp-env started on attempt ${attempt}."
              exit 0
            fi
            echo "::endgroup::"
            echo "wp-env start FAILED on attempt ${attempt}/${attempts}."
            if [ "${attempt}" -lt "${attempts}" ]; then
              backoff=$(( attempt * 30 ))
              echo "Retrying in ${backoff}s."
              sleep "${backoff}"
            fi
          done
          echo "wp-env failed to start after ${attempts} attempts. The original error is in the grouped logs above."
          exit 1

      # A fresh CI env installs WP at the pinned 7.0 with a matching DB, so this is
      # normally a no-op. It is kept as a defensive step + documentation: bumping
      # wp-env core over an EXISTING database leaves a stale db_version and every
      # admin page redirects to upgrade.php until the DB is upgraded.
      - name: Ensure DB matches core
        run: npx wp-env run cli wp core update-db

      - name: Run E2E (@smoke on pull_request/push, full suite nightly/manual)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npm run test:e2e
          else
            npm run test:e2e -- --grep @smoke
          fi

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop wp-env
        if: always()
        run: npm run env:stop
