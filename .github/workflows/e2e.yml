name: E2E (WordPress 7.0)

# E2E runs the FULL Playwright suite on EVERY trigger. There is deliberately no
# @smoke-only gate: a test that cannot block a merge is a test that can go red and
# stay red, which is exactly what happened for 25 consecutive nightlies (#697).
# Before this change the merge gate ran 211 of 352 tests, so 141 tests — including
# every test in ai-chat.spec.ts and token-concurrency.spec.ts — never ran on a PR.
#   - pull_request -> FULL suite. This is the merge gate. Reports a check on EVERY
#                     PR so it can be a required status check (issue 82).
#                     Intentionally NO paths-ignore here: a required check that is
#                     skipped on a docs-only PR leaves the PR blocked on a check
#                     that never reports, so it must always run and report on a PR.
#   - push to main -> FULL suite. Post-merge standing watcher: the merge commit is
#                     the first place two independently-green branches actually
#                     meet (paths-ignore keeps docs-only pushes from re-running).
#   - nightly cron -> FULL suite. KEEP THIS TRIGGER. It is not made redundant by
#                     the two above, because it is the only run that fires when NO
#                     code changed. That makes it the one that attributes a new
#                     red to ENVIRONMENT drift (a wp-env image rebuild, a
#                     WordPress 7.0 point release, a transitive npm dependency)
#                     rather than to a code regression.
#   - manual       -> FULL suite via workflow_dispatch.
#
# Cost, measured 2026-08-18 (run 32188773768 @smoke vs run 32110581111 full suite):
# fixed setup ~2.6 min either way; test execution 1086s (@smoke) vs 1821s (full).
# Gating on the full suite costs ~+12 min on a PR, ~21 -> ~33 min. Accepted:
# the alternative is 141 tests that no gate ever runs.
#
# Sharding across two runners was rejected, and would probably have been faster:
# estimated ~18 min wall (2.6 min setup + half of 1821s). That number is a
# derivation, not a measurement — no sharded run exists to cite, unlike the four
# figures above. Two reasons it was still rejected. First, each shard pays its own
# `wp-env start`, which doubles the dependency-network exposure the retry below
# exists to contain (#700). Second, tests/e2e/playwright.config.ts pins
# `fullyParallel: false` and `workers: 1`, so specs run in one deterministic order
# today; sharding changes which specs are co-resident and in what order, and this
# suite has never been proven order-independent. Revisit if that changes.
#
# Making the check REQUIRED is a manual repo-admin step (branch protection on main
# requiring "E2E (WordPress 7.0) / e2e" + "ai-ready-check"); the fine-grained PAT
# cannot set branch protection. No open issue tracks it — #82 covered adding the
# pull_request trigger and is closed — so TODOS.md carries it. Until branch
# protection is set, this workflow makes a red test VISIBLE on a PR but cannot
# itself make it unmergeable.
#
# The "suite is never narrowed" invariant is enforced by
# tests/InvariantTest.php::testE2eGateRunsTheEntireSuiteOnPullRequests and its two
# companions, so neither this file nor the Playwright config can quietly regrow a
# filter.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'readme.txt'
  schedule:
    - cron: '0 7 * * *'  # ~07:00 UTC nightly
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Dependency-network mitigation (issue #700). `wp-env start` builds its OWN
      # container images, and that build curls the Composer installer from
      # getcomposer.org and then runs `composer global require --dev
      # phpunit/phpunit` inside the tests-cli image (wp-env's GENERATED
      # Dockerfile — @wordpress/env lib/runtime/docker/init-config.js:271). No
      # repo manifest governs any of it, and wp-env's generated compose services
      # carry no `cache_from` (lib/runtime/docker/build-docker-compose-config.js),
      # so there is no supported hook for a buildx/layer cache. A bounded retry is
      # therefore the narrow mitigation: the observed failures (codeload 429 on
      # 2026-08-17, Composer 504 on 2026-08-16) are transient, and backoff is the
      # correct response to a 429.
      #
      # Why no explicit `env:stop` between attempts — two mechanisms, both in
      # @wordpress/env:
      #   1. lib/commands/start.js:79-88 catches a failed start and calls
      #      runtime.stop() best-effort, swallowing its own cleanup errors.
      #   2. lib/runtime/docker/index.js:148 calls stop() again at the top of the
      #      next start, because setCache() at :288 is only reached on success,
      #      so `shouldConfigureWp` is still true and the rebuild is forced.
      #
      # RESIDUAL RISKS, accepted:
      #   - the first attempt of every run still reaches the network, and a
      #     sustained (non-transient) outage still fails the job;
      #   - if Docker itself is wedged, mechanism 2's stop() can also fail — the
      #     retry then fails loudly on cleanup rather than running against a
      #     partially-started environment;
      #   - on a genuinely deterministic failure the job costs two extra failed
      #     start attempts plus the backoff before it reports.
      # The original error always stays visible in the grouped log; the retry
      # never hides it. Behaviour is pinned by
      # tests/InvariantTest.php::testWpEnvStartRetryIsBoundedAndFailsClosed.
      - name: Start wp-env (WordPress 7.0)
        run: |
          attempts=3
          for attempt in $(seq 1 "${attempts}"); do
            echo "::group::wp-env start (attempt ${attempt}/${attempts})"
            if npm run env:start; then
              echo "::endgroup::"
              echo "wp-env started on attempt ${attempt}."
              exit 0
            fi
            echo "::endgroup::"
            echo "wp-env start FAILED on attempt ${attempt}/${attempts}."
            if [ "${attempt}" -lt "${attempts}" ]; then
              backoff=$(( attempt * 30 ))
              echo "Retrying in ${backoff}s."
              sleep "${backoff}"
            fi
          done
          echo "wp-env failed to start after ${attempts} attempts. The original error is in the grouped logs above."
          exit 1

      # A fresh CI env installs WP at the pinned 7.0 with a matching DB, so this is
      # normally a no-op. It is kept as a defensive step + documentation: bumping
      # wp-env core over an EXISTING database leaves a stale db_version and every
      # admin page redirects to upgrade.php until the DB is upgraded.
      - name: Ensure DB matches core
        run: npx wp-env run cli wp core update-db

      # No event branching and no --grep: every trigger runs every test. Any
      # narrowing added here would re-open the #697 blind spot, so
      # tests/InvariantTest.php asserts on this exact run block.
      - name: Run E2E (full suite)
        run: |
          npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop wp-env
        if: always()
        run: npm run env:stop
