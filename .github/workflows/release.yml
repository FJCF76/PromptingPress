name: Package & Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4

      - name: Validate tag matches style.css version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CSS_VERSION=$(grep -m1 '^Version:' style.css | sed 's/Version:[[:space:]]*//' | tr -d '[:space:]')
          if [[ "$TAG_VERSION" != "$CSS_VERSION" ]]; then
            echo "ERROR: Git tag ($TAG_VERSION) does not match style.css Version ($CSS_VERSION)" >&2
            exit 1
          fi
          echo "Tag-version check: OK ($TAG_VERSION)"

      # Hard test gate: a broken release literally cannot be packaged or published.
      # PHP 8.3 because PHPUnit 10 requires PHP 8.1+ (theme runtime minimum is 8.0).
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHP unit tests
        run: composer test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: npm ci

      - name: JS unit tests
        run: npm test

      - name: Build theme ZIP
        run: bash scripts/package.sh

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: promptingpress-*.zip
